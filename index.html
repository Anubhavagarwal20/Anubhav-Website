<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0C0C" />
    <title>Anubhav Agarwal | SEO, GEO & Digital Marketing</title>
    <meta
      name="description"
      content="Anubhav Agarwal is a digital marketing specialist and MBA candidate working across SEO, GEO, Amazon and Shopify, performance marketing, and content strategy."
    />
    <meta name="author" content="Anubhav Agarwal" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical URL: Configure once production domain is assigned.
         Example: <link rel="canonical" href="https://YOUR-PRODUCTION-DOMAIN.com/" /> -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="profile" />
    <meta
      property="og:title"
      content="Anubhav Agarwal | Digital Marketing, SEO &amp; AI Search"
    />
    <meta
      property="og:description"
      content="Explore Anubhav Agarwal's experience in SEO, AI search optimization, e-commerce operations, performance marketing, and digital content strategy."
    />
    <meta property="og:site_name" content="Anubhav Agarwal Portfolio" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="/avatar.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Anubhav Agarwal | Digital Marketing, SEO &amp; AI Search"
    />
    <meta
      name="twitter:description"
      content="Explore Anubhav Agarwal's experience in SEO, AI search optimization, e-commerce operations, performance marketing, and digital content strategy."
    />
    <meta name="twitter:image" content="/avatar.jpg" />

    <!-- Google Fonts: Kanit (weights 300-900) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- JSON-LD Structured Data: Person & ProfilePage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "name": "Anubhav Agarwal",
            "jobTitle": "Digital Marketing Specialist",
            "description": "Digital marketing specialist and MBA candidate working across SEO, Generative Engine Optimization (GEO), Amazon and Shopify operations, performance marketing, and content strategy.",
            "email": "mailto:anubhavagarwal2020@gmail.com",
            "sameAs": [
              "https://www.linkedin.com/in/anubhavagarwal20/"
            ],
            "alumniOf": [
              {
                "@type": "EducationalOrganization",
                "name": "Maharaja Agrasen Institute of Technology (MAIT)",
                "location": "Rohini, Delhi, India"
              },
              {
                "@type": "EducationalOrganization",
                "name": "Chandigarh University",
                "location": "Ajitgarh, Punjab, India"
              }
            ],
            "knowsAbout": [
              "Search Engine Optimization (SEO)",
              "Generative Engine Optimization (GEO)",
              "AI Search Optimization",
              "E-commerce SEO",
              "Amazon Seller Central",
              "Shopify Optimization",
              "Performance Marketing",
              "Meta Ads",
              "Content Strategy",
              "Google Analytics 4 (GA4)"
            ],
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Delhi NCR",
              "addressCountry": "IN"
            }
          },
          {
            "@type": "ProfilePage",
            "name": "Anubhav Agarwal | SEO, GEO & Digital Marketing",
            "description": "Anubhav Agarwal is a digital marketing specialist and MBA candidate working across SEO, GEO, Amazon and Shopify, performance marketing, and content strategy.",
            "mainEntity": {
              "@type": "Person",
              "name": "Anubhav Agarwal"
            }
          }
        ]
      }
    </script>
  </head>
  <body class="bg-[#0C0C0C] text-[#D7E2EA]">
    <div id="root" class="bg-[#0C0C0C] min-h-screen"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
